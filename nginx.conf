server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # El sitio usa trailingSlash: 'never'. Servir $uri/index.html directamente
  # evita el 301 automático de nginx de /contacto a /contacto/.
  location / {
    try_files $uri $uri/index.html =404;
  }

  # Assets con hash en el nombre: nunca cambian.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
